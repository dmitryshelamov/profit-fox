# The database of the bench on the Mac, for development and quick checks (README, "Стенд на Маке"). The bench API and the Worker
# run with `dotnet run` and find it through ConnectionStrings:Bench of their appsettings.Development.json. The password is the
# password of this local database only, not a secret. Production is docker-compose.prod.yml.
# The names here keep "bench" (the project profit-fox-bench-dev, the service bench-db, the volume profit-fox-bench-dev-db, the
# database and the user bench) while production is named profit-fox: the volume holds the run ledger of the Mac, and Docker
# does not rename a volume (design merge-bench-and-bot, decision 9).
name: profit-fox-bench-dev

services:
  bench-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bench", "-d", "bench"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db:
    name: profit-fox-bench-dev-db
