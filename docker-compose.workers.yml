# The Workers of the runs of the bench on firebat-02 (192.168.8.181). deploy/deploy.sh runs it for one version on the
# machine whose ~/profit-fox/role says "workers", never by hand:
#   PROFIT_FOX_VERSION=<N> docker compose -f docker-compose.workers.yml --env-file ~/profit-fox/.env.prod up -d
# The database, the API and the scanner are on firebat-01 (docker-compose.prod.yml); these Workers reach its database on
# the LAN with the same PROFIT_FOX_DB_PASSWORD in .env.prod (mode 600, never committed). They take runs and never the
# scanner (Scanner:Enabled), and share one folder of the cache of history, the volume profit-fox-history-cache of this
# machine: it outlives a deploy, and removing it only makes the next reads ask the market-data service.
name: profit-fox

services:
  worker-1:
    image: ghcr.io/dmitryshelamov/profit-fox-bench-worker:${PROFIT_FOX_VERSION:?}
    restart: unless-stopped
    mem_limit: 5g
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Bench: Host=192.168.8.163;Port=5432;Database=profitfox;Username=profitfox;Password=${PROFIT_FOX_DB_PASSWORD:?}
      MarketData__GrpcUrl: http://192.168.8.213:5237
      MarketData__RestUrl: http://192.168.8.213:5236/
      MarketData__HistoryCache__Path: /var/cache/profit-fox/history
      Worker__Name: firebat-02-1
      Scanner__Enabled: "false"
    volumes:
      - history-cache:/var/cache/profit-fox/history

  worker-2:
    image: ghcr.io/dmitryshelamov/profit-fox-bench-worker:${PROFIT_FOX_VERSION:?}
    restart: unless-stopped
    mem_limit: 5g
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Bench: Host=192.168.8.163;Port=5432;Database=profitfox;Username=profitfox;Password=${PROFIT_FOX_DB_PASSWORD:?}
      MarketData__GrpcUrl: http://192.168.8.213:5237
      MarketData__RestUrl: http://192.168.8.213:5236/
      MarketData__HistoryCache__Path: /var/cache/profit-fox/history
      Worker__Name: firebat-02-2
      Scanner__Enabled: "false"
    volumes:
      - history-cache:/var/cache/profit-fox/history

volumes:
  history-cache:
    name: profit-fox-history-cache
