syntax = "proto3";

package profitfox.marketdata.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "ProfitFox.Bench.MarketData.Protos";

// The minute candles of the catalog as they come.
service CandleFeed {
  // Tells every minute candle of the exchanges asked for that the stream of its exchange told, once it closes and is
  // stored, as it is stored, until the caller ends the call. With `since`, the stored candles that opened at or after
  // it come first, oldest first, and the live ones follow with none left out. A candle may come again, such as with
  // its buy volume once a late trade completed it: the caller replaces the one it has by instrument and open time.
  // The response headers come once the subscription is in place.
  //
  // Live candles are only those of the streams. A minute a stream did not tell, as while its connection was lost, is
  // loaded and stored later, and so is a buy volume found later; neither is told live. A caller that needs them
  // subscribes again with `since`.
  //
  // With `forming`, the candle of the minute that goes on comes too, with `closed` false: at most once a second for an
  // instrument and only when it traded; on Bybit it comes once more when the minute before closes, which tells where
  // it opens. The closed candle of that minute follows and replaces it, except for an instrument whose candles are
  // not stored yet, as in the first minutes after it is listed or the service first starts: its minutes get no closed
  // candle until then. A forming candle is not stored and is not part of the catch-up; a caller that falls behind
  // stops getting them until it caught up.
  //
  // INVALID_ARGUMENT: `since` is further back than the service catches up, or an exchange asked for is not one of
  // `Exchange` or is EXCHANGE_UNSPECIFIED.
  // RESOURCE_EXHAUSTED: the caller read slower than the closed candles came and is cut off; it subscribes again with
  // `since`.
  // UNAVAILABLE: the service is stopping; the caller subscribes again with `since` once it is back.
  rpc Subscribe (SubscribeRequest) returns (stream CandleUpdate);

  // Tells the stored candles of the interval asked for over a window of past days, for backtests, and ends with OK.
  // Only what will not change is told: on Bybit, the minutes loaded whose buy volume the archive of trades of their day
  // has settled, which is a few hours after the day ends; on T-Invest, the minutes loaded. Nothing is loaded from the
  // exchange. Only instruments listed now are read: a delisted one is left out, even when named, so the history is the
  // one of the market as it is listed today.
  //
  // The coverage comes first: one `InstrumentCoverage` for every instrument read, ordered by instrument id, with the
  // parts of the window it covers; an instrument with none gets an empty one. The candles follow, by open time and,
  // within one open time, by instrument id, in an order that is the same on every read: the caller does not sort them.
  // A candle of the interval comes only when all its minutes are covered, with `closed` true. Read again, a window that
  // was covered both times gives the same messages in the same order; a caller that checks it by a hash hashes the
  // fields in the order they come, not the bytes of the messages, which protobuf does not keep the same.
  //
  // The service reads a few History calls at a time, those of every feed together; a call over that waits its turn
  // before anything comes, until the caller cancels it. A call over the whole market and years is read day by day as
  // the caller takes it: it takes long, not more memory.
  //
  // INVALID_ARGUMENT: the window does not end after it starts, ends after the start of the current UTC day or does not
  // start and end where candles of the interval start in UTC; the interval is CANDLE_INTERVAL_UNSPECIFIED; an exchange
  // is not one of `Exchange` or is EXCHANGE_UNSPECIFIED; an instrument id is not an id.
  // NOT_FOUND: an instrument id is not in the catalog.
  // UNAVAILABLE: the service is stopping; the caller reads again once it is back.
  rpc History (CandleHistoryRequest) returns (stream CandleHistoryItem);
}

enum Exchange {
  EXCHANGE_UNSPECIFIED = 0;
  EXCHANGE_BYBIT = 1;
  EXCHANGE_TINVEST = 2;
}

message SubscribeRequest {
  // The exchanges whose candles are wanted; none means all.
  repeated Exchange exchanges = 1;

  // Where to catch up from; absent means live candles only.
  google.protobuf.Timestamp since = 2;

  // Whether the candle of the minute that goes on is wanted too.
  bool forming = 3;
}

// A minute candle. Prices and volumes are decimal numbers as text, exactly as stored: "0.00001234".
message CandleUpdate {
  // The id of the instrument in the catalog, as GET api/instruments gives it.
  string instrument_id = 1;
  Exchange exchange = 2;
  google.protobuf.Timestamp open_time = 3;
  string open = 4;
  string high = 5;
  string low = 6;
  string close = 7;

  // What was traded: the base asset on Bybit, shares on T-Invest.
  string volume = 8;

  // What the trades were worth in the quote asset; absent where the exchange does not tell it.
  optional string turnover = 9;

  // The part of the volume traded in trades the buyer started; absent where it is not known.
  optional string buy_volume = 10;

  // Whether the minute is closed. A candle not closed is the forming one, as far as the trades of its minute went.
  bool closed = 11;
}

// The intervals candles are built in from the stored minutes, in UTC: a day starts at midnight, four hours at 00, 04,
// 08 and so on.
enum CandleInterval {
  CANDLE_INTERVAL_UNSPECIFIED = 0;
  CANDLE_INTERVAL_ONE_MINUTE = 1;
  CANDLE_INTERVAL_FIVE_MINUTES = 2;
  CANDLE_INTERVAL_FIFTEEN_MINUTES = 3;
  CANDLE_INTERVAL_ONE_HOUR = 4;
  CANDLE_INTERVAL_FOUR_HOURS = 5;
  CANDLE_INTERVAL_ONE_DAY = 6;
}

message CandleHistoryRequest {
  // The instruments to read, by their id in the catalog; none means every listed instrument of the exchanges asked for.
  repeated string instrument_ids = 1;

  // The exchanges whose instruments are read when none are named; none means all.
  repeated Exchange exchanges = 2;

  // Where the window starts, inclusive.
  google.protobuf.Timestamp from = 3;

  // Where the window ends, exclusive; not after the start of the current UTC day.
  google.protobuf.Timestamp to = 4;

  CandleInterval interval = 5;
}

// What a call of CandleFeed.History tells: first the coverage of every instrument, then the candles.
message CandleHistoryItem {
  oneof item {
    InstrumentCoverage coverage = 1;
    CandleUpdate candle = 2;
  }
}

// The parts of the window asked for that the history of an instrument covers: inside them, everything the exchange
// has is told; outside them, nothing is. Shared by the History calls of every feed.
message InstrumentCoverage {
  // The id of the instrument in the catalog, as GET api/instruments gives it.
  string instrument_id = 1;

  // The covered parts, cut to the window, oldest first and apart from one another; none when nothing is covered.
  repeated TimeRange ranges = 2;
}

// A part of time from `from`, inclusive, until `until`, exclusive.
message TimeRange {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp until = 2;
}
