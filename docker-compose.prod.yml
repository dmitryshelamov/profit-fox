# Production of the bench on firebat-01 (192.168.8.163). deploy/deploy.sh runs it for one version, never by hand:
#   PROFIT_FOX_VERSION=<N> docker compose -f docker-compose.prod.yml --env-file ~/profit-fox/.env.prod up -d
# The API with the page and both Workers run the images of version N, built from a commit of main. The secrets
# come from .env.prod on the server (mode 600, never committed): PROFIT_FOX_DB_PASSWORD (hex, so it needs no escaping in the
# connection string) and PROFIT_FOX_MASTER_KEY (openssl rand -base64 32), the master key of the secrets of the accounts of
# Bybit, which the API and the two Workers of this machine get (changes add-exchange-accounts and take-idea-trades): one of
# the Workers is the trading one. Without either, compose stops before it replaces a
# container, and the running version stays. Every other setting is the one of appsettings.json. The bench of firebat-01 is its own: its
# database, its Workers and its ledger are not shared with the Mac. The market-data service stays on soyo-02. The runs
# go on firebat-02 (docker-compose.workers.yml). The API keeps its cache of history for the previews in the volume
# profit-fox-history-cache: it outlives a deploy, and removing it only makes the next reads ask the market-data service.
name: profit-fox

services:
  # Published on the LAN address of firebat-01 only: the Workers of firebat-02 (docker-compose.workers.yml) reach it
  # there, with the password of .env.prod.
  db:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "192.168.8.163:5432:5432"
    environment:
      POSTGRES_DB: profitfox
      POSTGRES_USER: profitfox
      POSTGRES_PASSWORD: ${PROFIT_FOX_DB_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "profitfox", "-d", "profitfox"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Migrates the database on start. The page and /api are open on the LAN of firebat-01 without authorization, as the
  # other services of profit-fox are.
  api:
    image: ghcr.io/dmitryshelamov/profit-fox:${PROFIT_FOX_VERSION:?}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5240
      ConnectionStrings__Bench: Host=db;Port=5432;Database=profitfox;Username=profitfox;Password=${PROFIT_FOX_DB_PASSWORD:?}
      # The API does not start without it (README, «Аккаунты»); of the Workers only those of this machine get it.
      ExchangeAccounts__MasterKey: ${PROFIT_FOX_MASTER_KEY:?}
      MarketData__GrpcUrl: http://192.168.8.213:5237
      MarketData__RestUrl: http://192.168.8.213:5236/
      MarketData__HistoryCache__Path: /var/cache/profit-fox/history
    volumes:
      - history-cache:/var/cache/profit-fox/history
    ports:
      - "5240:5240"
    # Unhealthy while the database does not answer; the start period covers the migrations.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:5240/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # Two Workers of the scanner of ideas: one holds its lease, the other takes it when the first stops. They take no
  # runs (Worker:TakeRuns): a run and the scanner do not fit one process, the runs go to firebat-02. The scanner holds a
  # day of minutes of every pair and the graphs of every enabled strategy on every timeframe: about 4.5 GB with 14
  # strategies. A graph warms up on 1200 closed candles of its timeframe (Scanner:WarmupCandles, 500 by default): the
  # trend of trend-false-break-48h is the mean of 1199 closes of 4h. They are the trading Workers too (change
  # take-idea-trades, README «Сделки»): one holds the lease of the trader, sends the orders to Bybit and leads the trades,
  # the other takes it over when the first stops; so both get the master key of the secrets of the accounts.
  worker-1:
    image: ghcr.io/dmitryshelamov/profit-fox-bench-worker:${PROFIT_FOX_VERSION:?}
    restart: unless-stopped
    mem_limit: 8g
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Bench: Host=db;Port=5432;Database=profitfox;Username=profitfox;Password=${PROFIT_FOX_DB_PASSWORD:?}
      MarketData__GrpcUrl: http://192.168.8.213:5237
      MarketData__RestUrl: http://192.168.8.213:5236/
      Worker__Name: firebat-01-1
      Worker__TakeRuns: "false"
      Scanner__WarmupCandles: "1200"
      Trading__Enabled: "true"
      ExchangeAccounts__MasterKey: ${PROFIT_FOX_MASTER_KEY:?}

  worker-2:
    image: ghcr.io/dmitryshelamov/profit-fox-bench-worker:${PROFIT_FOX_VERSION:?}
    restart: unless-stopped
    mem_limit: 8g
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Bench: Host=db;Port=5432;Database=profitfox;Username=profitfox;Password=${PROFIT_FOX_DB_PASSWORD:?}
      MarketData__GrpcUrl: http://192.168.8.213:5237
      MarketData__RestUrl: http://192.168.8.213:5236/
      Worker__Name: firebat-01-2
      Worker__TakeRuns: "false"
      Scanner__WarmupCandles: "1200"
      Trading__Enabled: "true"
      ExchangeAccounts__MasterKey: ${PROFIT_FOX_MASTER_KEY:?}

volumes:
  db:
    name: profit-fox-db
  history-cache:
    name: profit-fox-history-cache
