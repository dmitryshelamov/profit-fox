name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/ProfitFox.sln

      - name: Build
        run: dotnet build backend/ProfitFox.sln --no-restore

      # Integration tests start TimescaleDB through Testcontainers on the runner's Docker.
      - name: Test
        run: dotnet test backend/ProfitFox.sln --no-build

      - name: Verify format
        run: dotnet format backend/ProfitFox.sln --verify-no-changes --no-restore

  # Files of the production deploy; deploy.sh runs on the server, where its command is the only input.
  deploy-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck deploy/*.sh

      - name: Deploy script tests
        run: bash deploy/deploy.test.sh

      # Test values: the real ones live only on the server.
      - name: Production compose file
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          PROFITFOX_VERSION: 1
          PROFITFOX_DB_PASSWORD: test
          PROFITFOX_MASTER_KEY: test
