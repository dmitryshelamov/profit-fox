name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/ProfitFox.sln

      - name: Build
        run: dotnet build backend/ProfitFox.sln --no-restore

      # Integration tests start TimescaleDB through Testcontainers on the runner's Docker.
      - name: Test
        run: dotnet test backend/ProfitFox.sln --no-build

      # A large fixed offset with no daylight saving: code that reads local time instead of UTC shifts by 9 hours.
      - name: Test in Asia/Tokyo time zone
        run: dotnet test backend/ProfitFox.sln --no-build
        env:
          TZ: Asia/Tokyo

      - name: Verify format
        run: dotnet format backend/ProfitFox.sln --verify-no-changes --no-restore
