name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/tests/ProfitFox.Tests.Shared/Fixtures/Strategies/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/tests/ProfitFox.Tests.Shared/Fixtures/Strategies/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Model tests read the reference strategies of the backend tests.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
